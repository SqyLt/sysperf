<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SysPerf — 系统性能查看器</title>
<style>
:root{
  --bg:#f6f5f1; --card:#fcfbf8; --card2:#f9f8f4;
  --line:#e0ddd4; --rowline:#e8e5dc; --track:#eceae2;
  --txt:#17181a; --dim:#8b8778; --dim2:#b0aca0;
  --ink:#17181a; --ink2:#8b8778; --warn:#c0392b;
  --gridc:#e6e3da;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);
  font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-feature-settings:"tnum"}
header{display:flex;align-items:center;gap:14px;padding:13px 22px 11px}
.ttl{display:flex;align-items:baseline;gap:9px}
.ttl h1{font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
.ttl span{font-size:12px;color:var(--dim)}
.hsub{font-size:12px;color:var(--dim)}
.hright{margin-left:auto;display:flex;gap:0}
.pill{font-size:12px;color:var(--dim);padding:0 16px;border-right:1px solid var(--line);white-space:nowrap}
.pill:last-child{border-right:none}
.pill b{color:var(--txt);font-family:ui-monospace,"SF Mono",Consolas,monospace;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink);display:inline-block;margin-right:6px}
main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 22px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 18px;min-width:0}
.span2{grid-column:span 2}
.chead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.ct{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--txt)}
.ct i{font-style:normal;font-weight:400;color:var(--dim2);letter-spacing:1px}
.cmeta{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.big{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:34px;font-weight:300;letter-spacing:-1.5px;line-height:1;color:var(--ink)}
.unit{font-size:12px;color:var(--dim2);margin-left:3px}
.chart{width:100%;height:54px;display:block}
.gwrap{padding:14px 16px}
.gcells{display:grid;gap:12px}
.gcard{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:13px 15px;min-width:0}
.cores{display:flex;gap:3px;align-items:flex-end;height:38px;margin-top:10px}
.cores i{flex:1;min-width:3px;background:var(--ink);opacity:.8;height:6%}
.mbar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;display:flex;margin-bottom:10px}
.mbar i{display:block;height:100%;transition:width .5s linear}
.kv{display:flex;flex-wrap:wrap;gap:5px 20px;font-size:12px;color:var(--dim)}
.kv b{color:var(--txt);font-family:ui-monospace,"SF Mono",Consolas,monospace;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim2);font-size:10.5px;font-weight:600;text-align:left;padding:2px 8px 7px 0;letter-spacing:1.5px;text-transform:uppercase}
td{padding:3.5px 8px 3.5px 0;border-top:1px solid var(--rowline);font-family:ui-monospace,"SF Mono",Consolas,monospace}
td.nm{font-family:inherit;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.r,th.r{text-align:right}
td.dim{color:var(--dim2)}
.warm,.hot{color:var(--warn)!important}
</style>
</head>
<body>
<header>
  <div class="ttl"><h1>SysPerf</h1><span>系统性能查看器</span></div>
  <div class="hsub" id="host"></div>
  <div class="hright">
    <span class="pill"><i class="dot"></i>实时 <b id="up"></b></span>
    <span class="pill">负载 <b id="load"></b></span>
    <span class="pill" id="clock"></span>
  </div>
</header>
<main>
  <section class="card">
    <div class="chead"><span class="ct">CPU</span><span class="cmeta" id="cpumeta"></span>
      <span class="big" id="cpupct"></span><span class="unit">%</span></div>
    <canvas class="chart" id="cv-cpu"></canvas>
    <div class="cores" id="cores"></div>
  </section>
  <section class="card">
    <div class="chead"><span class="ct">内存</span><span class="cmeta" id="memmeta"></span>
      <span class="big" id="mempct"></span><span class="unit">%</span></div>
    <div class="mbar"><i id="membar" style="background:var(--ink)"></i><i id="memcache" style="background:var(--dim2)"></i></div>
    <div class="kv" id="memkv"></div>
    <canvas class="chart" id="cv-mem"></canvas>
  </section>
  <section class="card span2 gwrap"><div class="gcells" id="gpus" style="grid-template-columns:repeat(2,1fr)"></div></section>
  <section class="card">
    <div class="chead"><span class="ct">磁盘 I/O</span><span class="cmeta">所有整盘</span></div>
    <canvas class="chart" id="cv-disk"></canvas>
    <div class="kv"><span>读 <b id="dkr"></b></span><span>写 <b id="dkw"></b></span></div>
  </section>
  <section class="card">
    <div class="chead"><span class="ct">网络</span><span class="cmeta">除 lo</span></div>
    <canvas class="chart" id="cv-net"></canvas>
    <div class="kv"><span>下行 <b id="nrx"></b></span><span>上行 <b id="ntx"></b></span></div>
  </section>
  <section class="card">
    <div class="chead"><span class="ct">进程 Top 10 <i>· CPU</i></span></div>
    <table id="tab-cpu"></table>
  </section>
  <section class="card">
    <div class="chead"><span class="ct">进程 Top 10 <i>· 内存</i></span></div>
    <table id="tab-mem"></table>
  </section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const GB=1073741824, MB=1048576;
const fGB=b=>(b/GB).toFixed(1);
const fRate=b=>{b/=MB;return b>=1024?(b/1024).toFixed(2)+" GB/s":b.toFixed(1)+" MB/s"};
const fUptime=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return (d?d+"d ":"")+h+"h "+m+"m"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getCSS=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function draw(cv,series,opt){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=Math.max(10,r.width*dpr); cv.height=Math.max(10,r.height*dpr);
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=r.width,h=r.height;
  ctx.clearRect(0,0,w,h);
  if(opt.grid){
    ctx.strokeStyle=opt.grid;ctx.lineWidth=1;
    for(let i=1;i<=3;i++){const y=h*i/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  }
  const N=300;
  for(const s of series){
    const d=s.data; if(!d||d.length<2) continue;
    let m=opt.max;
    if(!m){m=0;for(const v of d)if(v>m)m=v;m=Math.max(m*1.15,1e-6);}
    const step=w/(N-1), x0=w-(d.length-1)*step;
    const px=i=>[x0+i*step, h-Math.min(1,d[i]/m)*(h-8)-3];
    ctx.beginPath();
    d.forEach((v,i)=>{const[x,y]=px(i); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.strokeStyle=s.color; ctx.lineWidth=1.5; ctx.lineJoin="round"; ctx.stroke();
  }
}
function cores(el,vals){
  if(el.children.length!==vals.length)
    el.innerHTML=vals.map(()=>"<i></i>").join("");
  vals.forEach((v,i)=>{const e=el.children[i];
    if(e){e.style.height=Math.max(6,v)+"%"; e.style.opacity=v<2?.25:.8;}});
}
function tbl(el,rows){
  let h="<tr><th>名称</th><th class='r'>PID</th><th class='r'>CPU %</th><th class='r'>内存</th></tr>";
  for(const p of rows)
    h+=`<tr><td class="nm" title="${esc(p.name)}">${esc(p.name)}</td>
        <td class="r dim">${p.pid}</td><td class="r">${p.cpu.toFixed(1)}</td>
        <td class="r">${p.memMb} MB</td></tr>`;
  el.innerHTML=h;
}
const GPUTPL=i=>`<div class="gcard">
  <div class="chead"><span class="ct">GPU <i>${i}</i></span><span class="cmeta" id="g${i}-n"></span>
    <span class="big" id="g${i}-u"></span><span class="unit">%</span></div>
  <canvas class="chart" id="cv-g${i}" style="height:46px"></canvas>
  <div class="mbar"><i id="g${i}-mbar" style="background:var(--ink)"></i></div>
  <div class="kv">
    <span>显存 <b id="g${i}-m"></b></span><span>温度 <b id="g${i}-t"></b></span>
    <span>功耗 <b id="g${i}-p"></b></span><span>风扇 <b id="g${i}-f"></b></span><span>频率 <b id="g${i}-c"></b></span>
  </div></div>`;
let gpuN=0;
function buildGpus(n){
  if(n===gpuN) return;
  gpuN=n;
  const box=$("gpus");
  box.style.gridTemplateColumns=`repeat(${n},1fr)`;
  box.innerHTML=Array.from({length:n},(_,i)=>GPUTPL(i)).join("");
}

async function tick(){
  let d;
  try{ d=await (await fetch("/api/stats")).json(); }catch(e){ return; }
  const s=d.stats, H=d.history;
  if(!s) return;
  const INK=getCSS("--ink"), GRID=getCSS("--gridc");
  // 顶栏
  $("host").textContent=`${s.system.distro} · ${s.system.hostname} · kernel ${s.system.kernel}`;
  $("up").textContent=fUptime(s.system.uptime);
  $("load").textContent=s.system.load.map(x=>x.toFixed(2)).join(" / ");
  $("clock").textContent=new Date().toLocaleTimeString("zh-CN",{hour12:false});
  // CPU
  $("cpumeta").textContent=`${s.system.model} · ${s.cpu.n} 线程 · ${s.cpu.freqMHz} MHz`;
  $("cpupct").textContent=s.cpu.usage.toFixed(1);
  draw($("cv-cpu"),[{data:H.cpu,color:INK}],{max:100,grid:GRID});
  cores($("cores"),s.cpu.cores);
  // 内存
  const m=s.mem;
  $("mempct").textContent=(100*m.used/m.total).toFixed(1);
  $("memmeta").textContent=`${fGB(m.total)} GB 总容量`;
  $("membar").style.width=(100*m.used/m.total)+"%";
  $("memcache").style.width=(100*m.cached/m.total)+"%";
  $("memkv").innerHTML=
    `<span>已用 <b>${fGB(m.used)}</b> / ${fGB(m.total)} GB</span>`+
    `<span>缓存 <b>${fGB(m.cached)}</b> GB</span>`+
    `<span>Swap <b>${m.swapTotal?(m.swapUsed/GB).toFixed(1)+" / "+(m.swapTotal/GB).toFixed(1)+" GB":"—"}</b></span>`;
  draw($("cv-mem"),[{data:H.mem,color:INK}],{max:m.total/MB,grid:GRID});
  // GPU
  buildGpus(s.gpus.length);
  s.gpus.forEach((g,i)=>{
    $(`g${i}-u`).textContent=(g.util??0).toFixed(0);
    $(`g${i}-n`).textContent=g.name.replace("NVIDIA ","");
    $(`g${i}-m`).textContent=`${(g.memUsed/1024).toFixed(1)} / ${(g.memTotal/1024).toFixed(0)} GB`;
    $(`g${i}-mbar`).style.width=(g.memTotal?100*g.memUsed/g.memTotal:0)+"%";
    const t=$( `g${i}-t`);
    t.textContent=(g.temp??0)+"°C";
    t.className=g.temp>=85?"hot":g.temp>=75?"warm":"";
    $(`g${i}-p`).textContent=`${(g.power??0).toFixed(0)} / ${g.powerLimit} W`;
    $(`g${i}-f`).textContent=(g.fan==null?"—":g.fan+"%");
    $(`g${i}-c`).textContent=g.clock+" MHz";
    draw($(`cv-g${i}`),[{data:H.gpuUtil[i],color:INK}],{max:100,grid:GRID});
  });
  // 磁盘 / 网络
  $("dkr").textContent=fRate(s.disk.r);
  $("dkw").textContent=fRate(s.disk.w);
  draw($("cv-disk"),[
    {data:H.diskR.map(v=>v/MB),color:INK},
    {data:H.diskW.map(v=>v/MB),color:getCSS("--ink2")}],{grid:GRID});
  $("nrx").textContent=fRate(s.net.rx);
  $("ntx").textContent=fRate(s.net.tx);
  draw($("cv-net"),[
    {data:H.netRx.map(v=>v/MB),color:INK},
    {data:H.netTx.map(v=>v/MB),color:getCSS("--ink2")}],{grid:GRID});
  // 进程
  tbl($("tab-cpu"),s.procs.byCpu);
  tbl($("tab-mem"),s.procs.byMem);
}
window.scrollTo(0,0);
tick(); setInterval(tick,1000);
window.addEventListener("resize",tick);
</script>
</body>
</html>
